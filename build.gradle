plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Modrinth's maven, used for compile-time API access to Create / Create Aeronautics / Sable.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // GeckoLib, used for the animated space suit model.
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    // Create's own maven - Modrinth's maven wrapper only serves Create's own fat jar, not Flywheel/Catnip
    // as separate artifacts, so those two need to come from here instead.
    maven {
        name = "CreateMod"
        url = "https://maven.createmod.net/"
    }

    // Sable's own maven - Modrinth's maven wrapper only serves Sable's own fat jar, which jar-in-jars its
    // companion module (Pose3dc/SubLevelAccess/etc, used for ship-relative transforms) rather than exposing
    // it as a normal transitive dependency, so that needs to come from here instead to compile against it.
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create Astronautics is an addon for Create (+ Create Aeronautics / Sable) - the space suit model uses
    // GeckoLib, and its visor uses Create's own baked-mesh rendering utilities.
    compileOnly "maven.modrinth:create:6.0.10+mc1.21.1"
    localRuntime "maven.modrinth:create:6.0.10+mc1.21.1"

    compileOnly "maven.modrinth:create-aeronautics:1.3.0+mc1.21.1"
    localRuntime "maven.modrinth:create-aeronautics:1.3.0+mc1.21.1"

    compileOnly "maven.modrinth:sable:2.0.3+mc1.21.1"
    localRuntime "maven.modrinth:sable:2.0.3+mc1.21.1"

    // Sable's companion module (Pose3dc/SubLevelAccess ship-transform API) is jar-in-jar bundled inside the
    // main Sable jar above rather than exposed as a normal transitive dependency, so it's resolved
    // separately here to compile against it - version pinned to the exact copy jar-in-jar'd inside Sable
    // 2.0.3 itself (confirmed via its jar-in-jar filename), same reasoning as Flywheel/Catnip/Ponder below.
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0"

    // Flywheel/Catnip back the space suit visor's baked-mesh rendering; Ponder backs the SmartBlockEntity
    // base class used by the solid rocket booster's block entity. All three are bundled inside Create's own
    // jar at runtime, but need to be resolved separately here for compiling against their classes.
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6-42"
    compileOnly "net.createmod.catnip:Catnip-NeoForge-1.21.1:0.8.54"
    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.69"

    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.2"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
