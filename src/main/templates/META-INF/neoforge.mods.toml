modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#logoFile="createastronautics.png" #optional
description='''
An addon for Create, Create Aeronautics and Sable that adds space travel.
Currently adds two dimensions: the Moon and Deep Space.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create Astronautics is an addon for Create (+ Create Aeronautics / Sable) - the space suit's visor uses
# Create's own baked-mesh rendering utilities, and Sable's per-dimension gravity is configured for the Moon
# and Deep Space, so these are genuine requirements now rather than optional.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4,)"
    ordering="AFTER"
    side="BOTH"
